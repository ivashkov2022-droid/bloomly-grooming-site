server {
    listen 80;
    listen [::]:80;
    server_name bloomly-grooming-7q4m9x2.vazuri.ru;

    root /var/www/bloomly-grooming-7q4m9x2;
    index index.html;

    access_log /var/log/nginx/bloomly-grooming-7q4m9x2.access.log;
    error_log /var/log/nginx/bloomly-grooming-7q4m9x2.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, follow, noarchive" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|mp4|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Robots-Tag "noindex, follow, noarchive" always;
        try_files $uri =404;
    }
}
