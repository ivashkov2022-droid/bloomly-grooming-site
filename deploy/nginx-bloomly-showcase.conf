# Add this snippet inside the existing HTTPS `server` block for vazuri.ru.
# The site files stay isolated in /var/www/bloomly-grooming-7q4m9x2.

location = /bloomly-7q4m9x2 {
    return 301 https://vazuri.ru/bloomly-7q4m9x2/;
}

location ~* ^/bloomly-7q4m9x2/(.+\.(?:css|js|jpe?g|png|webp|svg|mp4|woff2))$ {
    alias /var/www/bloomly-grooming-7q4m9x2/$1;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, follow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

location = /bloomly-7q4m9x2/ {
    rewrite ^ /index.html break;
    root /var/www/bloomly-grooming-7q4m9x2;
    charset utf-8;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, follow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

location = /bloomly-7q4m9x2/privacy {
    return 301 https://vazuri.ru/bloomly-7q4m9x2/privacy/;
}

location = /bloomly-7q4m9x2/privacy/ {
    rewrite ^ /privacy/index.html break;
    root /var/www/bloomly-grooming-7q4m9x2;
    charset utf-8;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, follow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

location = /bloomly-7q4m9x2/robots.txt {
    rewrite ^ /robots.txt break;
    root /var/www/bloomly-grooming-7q4m9x2;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, follow, noarchive" always;
}

location = /bloomly-7q4m9x2/sitemap.xml {
    rewrite ^ /sitemap.xml break;
    root /var/www/bloomly-grooming-7q4m9x2;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, follow, noarchive" always;
}
